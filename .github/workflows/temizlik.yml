name: Temizlik (tek seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Deneme dosyalarini sil
        run: |
          PY="aday_test ayirt_et ayirt_et2 bot_cikis bot_ema bot_ema2 bot_olcum bot_olcum2 bot_saglamlik bot_saglamlik2 dogrula kesif kesisim kural_kontrol kural_ornek kural_ornek2 kutu_gorsel kutu_grid kutu_orneklem kutu_tani kutu_test kutu_yeni orneklem uyari_olc uyari_olc2"
          YML="aday ayirt ayirt2 bot_cikis bot_ema bot_ema2 bot_olcum bot_olcum2 bot_saglamlik bot_saglamlik2 dogrula gecmis kesif kesisim kural_kontrol kural_ornek kural_ornek2 kutu_gorsel kutu_grid kutu_orneklem kutu_tani kutu_test orneklem uyari uyari2 temizlik"
          for f in $PY; do git rm -q --ignore-unmatch "$f.py"; done
          for f in $YML; do git rm -q --ignore-unmatch ".github/workflows/$f.yml"; done

      - name: Kalan dosyalar calisiyor mu (calismiyorsa hicbir sey silinmez)
        run: |
          python -c "import fd_core, scan, calibrate, gecmis_tara, aday_gunluk, takip, ileri_test; print('kalanlar sorunsuz')"
          python ileri_test.py state/etiket_kayit.csv state/orneklem.csv state/orneklem2.csv

      - name: Kaydet
        run: |
          git config user.name "bist-tarayici"
          git config user.email "bist-tarayici@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "deneme dosyalari temizlendi"
            git push
          fi
