name: Temizlik 3 (tek seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Biten base denemelerini sil
        run: |
          # base_v0 / base_v2 / base_v3 .py KALIR (tarama bunları kullanıyor).
          # Workflow (.yml) dosyalarına GitHub otomatik dokunulmasına izin vermiyor; onlar elle silinir.
          PY="base_v1 base_kesif"
          for f in $PY; do git rm -q --ignore-unmatch "$f.py"; done

      - name: Kalan dosyalar calisiyor mu (calismiyorsa hicbir sey silinmez)
        run: |
          python -c "import fd_core, scan, kayit, base_v0, base_v2, base_v3, base_olc, base_direnc, kacan_tani, telegram_isle, ileri_test, grafik, grafik_test; print('kalanlar sorunsuz')"
          python ileri_test.py

      - name: Kaydet
        run: |
          git config user.name "bist-tarayici"
          git config user.email "bist-tarayici@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "biten base denemeleri temizlendi"
            git pull --rebase
            git push
          fi
