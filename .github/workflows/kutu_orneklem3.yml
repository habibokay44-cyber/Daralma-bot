name: Kutu orneklem 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orneklem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: TradingView veri kütüphanesi
        run: pip install "git+https://github.com/rongardF/tvdatafeed.git"

      - name: Kutu dedektorunden rastgele 40 kutu sec, Telegram'a gonder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kutu_orneklem3.py --telegram

      - name: Orneklem dosyasini repoya kaydet
        run: |
          git config user.name "bist-tarayici"
          git config user.email "bist-tarayici@users.noreply.github.com"
          git add state/orneklem3.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "kutu orneklem 2"
            git push
          fi
