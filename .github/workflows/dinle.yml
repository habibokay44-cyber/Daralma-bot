name: Canli dinleme (butonlar)

on:
  workflow_dispatch:
    inputs:
      dakika:
        description: "En fazla kac dakika"
        default: "40"
      bos:
        description: "Kac dakika basis gelmezse kapansin"
        default: "10"

permissions:
  contents: write

concurrency:
  group: bist-tarama
  cancel-in-progress: false

jobs:
  dinle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dinle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_isle.py --dinle ${{ github.event.inputs.dakika }} ${{ github.event.inputs.bos }}

      - name: Kaydet
        if: always()
        run: |
          git config user.name "bist-tarayici"
          git config user.email "bist-tarayici@users.noreply.github.com"
          git add state/etiket_kayit.csv state/tg_offset.json state/kacan.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "isaretler islendi (canli dinleme)"
            git pull --rebase
            git push
          fi
