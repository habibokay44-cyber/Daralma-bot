name: Geriye donuk portfoy

on:
  workflow_dispatch:
    inputs:
      baslangic:
        description: "Başlangıç tarihi (YYYY-AA-GG)"
        default: "2023-01-02"
      sermaye:
        description: "Başlangıç sermayesi (TL)"
        default: "1000000"
      ek:
        description: "Ek seçenek (--dagilim = işlem sayısı/risk varyantları)"
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: TradingView veri kütüphanesi
        run: pip install "git+https://github.com/rongardF/tvdatafeed.git"

      - name: Geriye donuk portfoy testi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python geriye_portfoy.py ${{ github.event.inputs.baslangic }} ${{ github.event.inputs.sermaye }} ${{ github.event.inputs.ek }} --telegram
