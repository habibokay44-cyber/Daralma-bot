name: Rastgele orneklem

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orneklem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: TradingView veri kütüphanesi
        run: pip install "git+https://github.com/rongardF/tvdatafeed.git"

      - name: Gecmisten rastgele 40 etiket sec, Telegram'a gonder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orneklem.py --telegram

      - name: Orneklem dosyasini repoya kaydet
        run: |
          git config user.name "bist-tarayici"
          git config user.email "bist-tarayici@users.noreply.github.com"
          git add state/orneklem.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "rastgele orneklem"
            git push
          fi
