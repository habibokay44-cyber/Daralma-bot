name: Base olcum

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bist-tarama
  cancel-in-progress: false

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: TradingView veri kütüphanesi
        run: pip install "git+https://github.com/rongardF/tvdatafeed.git"

      - name: Bekleyen Telegram mesajlarini isle (kacan kayitlari)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_isle.py || true

      - name: Base olcumu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python base_olc.py --telegram

      - name: Kaydet
        run: |
          git config user.name "bist-tarayici"
          git config user.email "bist-tarayici@users.noreply.github.com"
          git add state/etiket_kayit.csv state/tg_offset.json state/kacan.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "kacan kayitlari islendi"
            git pull --rebase
            git push
          fi
