name: Hisse olay tanisi

on:
  workflow_dispatch:
    inputs:
      hisse:
        description: "Hisse kodu"
        default: "KTLEV"
      baslangic:
        description: "Başlangıç (YYYY-AA-GG)"
        default: "2026-06-15"
      bitis:
        description: "Bitiş (YYYY-AA-GG)"
        default: "2026-08-15"

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: TradingView veri kütüphanesi
        run: pip install "git+https://github.com/rongardF/tvdatafeed.git"

      - name: Olay tanisi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hisse_olay.py ${{ github.event.inputs.hisse }} ${{ github.event.inputs.baslangic }} ${{ github.event.inputs.bitis }} --telegram
