name: Temizlik 2 (tek seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Deneme dosyalarini sil
        run: |
          PY="ema_test kutu_yeni kutu_kontrol kutu_orneklem3 ob_test yukselis_test"
          YML="ema_test kutu_kontrol kutu_orneklem3 ob_test yukselis_test temizlik2"
          for f in $PY; do git rm -q --ignore-unmatch "$f.py"; done
          for f in $YML; do git rm -q --ignore-unmatch ".github/workflows/$f.yml"; done

      - name: Kalan dosyalar calisiyor mu (calismiyorsa hicbir sey silinmez)
        run: |
          python -c "import fd_core, scan, calibrate, gecmis_tara, aday_gunluk, takip, ileri_test, grafik, grafik_test; print('kalanlar sorunsuz')"
          python ileri_test.py state/etiket_kayit.csv state/orneklem.csv state/orneklem2.csv state/orneklem3.csv

      - name: Kaydet
        run: |
          git config user.name "bist-tarayici"
          git config user.email "bist-tarayici@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "deneme dosyalari temizlendi (2)"
            git push
          fi
