name: BIST tarama

on:
  schedule:
    # Hafta içi 16:00 UTC = 19:00 Türkiye saati (BIST kapanışından sonra)
    - cron: "11 16 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "Son kaç mumdaki sinyaller bildirilsin"
        default: "2"
      heartbeat:
        description: "Sinyal olmasa da özet mesajı gönder (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: bist-tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: TradingView veri kütüphanesi
        continue-on-error: true
        run: pip install --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: Bekleyen Telegram cevaplarini isle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_isle.py || true
      - name: Tara ve Telegram'a gönder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAYS: ${{ github.event.inputs.days || '2' }}
          HEARTBEAT: ${{ github.event.inputs.heartbeat || 'true' }}
        run: |
          ARGS="--days $DAYS"
          if [ "$HEARTBEAT" = "true" ]; then ARGS="$ARGS --heartbeat"; fi
          python scan.py $ARGS

      - name: Gönderilenler listesini kaydet (tekrar mesaj gitmesin)
        run: |
          git config user.name "bist-tarayici"
          git config user.email "bist-tarayici@users.noreply.github.com"
          git add state/sent.json state/etiket_kayit.csv state/tg_mesaj.json state/tg_offset.json state/kacan.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "tarama durumu"
            git pull --rebase
            git push
          fi
