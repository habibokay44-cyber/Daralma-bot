name: Grafik test

on:
  workflow_dispatch:
    inputs:
      adet:
        description: "Kayıttaki son kaç etiketin grafiği gönderilsin"
        default: "5"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: TradingView veri kütüphanesi
        run: pip install "git+https://github.com/rongardF/tvdatafeed.git"

      - name: Son etiketlerin grafiklerini gonder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python grafik_test.py ${{ github.event.inputs.adet || '5' }}
