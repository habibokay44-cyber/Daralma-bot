name: Kaynak tani

on:
  workflow_dispatch:
    inputs:
      hisseler:
        description: "Hisseler (boşlukla ayır)"
        default: "DZGYO BAYRK MAKIM OZYSR DURDO"

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: TradingView veri kütüphanesi
        run: pip install "git+https://github.com/rongardF/tvdatafeed.git"

      - name: Yahoo ve TradingView karsilastirmasi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kaynak_tani.py ${{ github.event.inputs.hisseler }} --telegram
