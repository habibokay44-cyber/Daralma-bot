name: Ornek kontrol

on:
  workflow_dispatch:
    inputs:
      arg:
        default: "KONTR 2021-12-02"

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install "git+https://github.com/rongardF/tvdatafeed.git"
      - run: python ornek_kontrol.py ${{ github.event.inputs.arg }}
