name: Isaretleri isle

on:
  schedule:
    # 3 saatte bir: Telegram butonlarına bastıklarını ve tarih cevaplarını kayda yazar
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bist-tarama
  cancel-in-progress: false

jobs:
  isle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Telegram cevaplarini kayda isle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_isle.py

      - name: Kaydet
        run: |
          git config user.name "bist-tarayici"
          git config user.email "bist-tarayici@users.noreply.github.com"
          git add state/etiket_kayit.csv state/tg_offset.json || true
          if ! git diff --cached --quiet; then
            git commit -m "isaretler islendi"
            git pull --rebase
            git push
          fi
